name: Release yClippy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: linux
            artifact: yclippy-linux-amd64.deb
            build_cmd: bun run tauri build --bundles deb --target x86_64-unknown-linux-gnu
          - target: android
            artifact: yclippy-android-arm64.apk
            build_cmd: bun run tauri android build --ci --apk --target aarch64
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        if: matrix.target == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || '' }}

      - name: Install Linux system dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Sign APK
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > /tmp/yclippy-release.jks
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign" -p -f 4 \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            yclippy-android-arm64-aligned.apk
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/yclippy-release.jks \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "${{ matrix.artifact }}" \
            yclippy-android-arm64-aligned.apk
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "${{ matrix.artifact }}"

      - name: Collect artifacts
        run: |
          mkdir -p release
          if [ "${{ matrix.target }}" = "linux" ]; then
            find src-tauri/target -name "*.deb" -exec cp {} release/ \;
          fi
          if [ "${{ matrix.target }}" = "android" ]; then
            cp "${{ matrix.artifact }}" release/
          fi

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*